# Dependabot configuration for mailhuset-sdks
# https://docs.github.com/en/code-security/dependabot

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    groups:
      # One PR a week for the routine churn; majors still come singly.
      minor-and-patch:
        update-types: ["minor", "patch"]
