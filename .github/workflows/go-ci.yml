name: go-ci

on:
  push:
    paths: ["go/**", ".github/workflows/go-ci.yml"]
  pull_request:
    paths: ["go/**", ".github/workflows/go-ci.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.21"
      - run: go vet ./...
      - run: go build ./...
